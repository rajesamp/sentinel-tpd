name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # v4 — SHA-pinned
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.14
        # v5 — SHA-pinned
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Run tests (17 suites)
        run: python -m unittest discover -s tests -v

      - name: Check alignment with the evaluated research baseline
        run: python tools/check_research_alignment.py

      - name: Generate SBOM (CycloneDX)
        # v0 — SHA-pinned, Syft-backed
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        # v4 — SHA-pinned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Attest build provenance (SLSA L3)
        # v2 — SHA-pinned, GitHub-native sigstore attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: sbom.cdx.json
